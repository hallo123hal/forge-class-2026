    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/97a1f883-6a1c-49d8-b927-257280f93daf
permissions:
  scopes:
    - read:jira-work
    - storage:app
