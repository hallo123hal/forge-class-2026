name: CI

on:
  pull_request:
    paths:
      - 'Project-Health-Dashboard-Project-Page-3/**'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'Project-Health-Dashboard-Project-Page-3/**'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w project-health-dashboard-project-page-3

      - name: Test
        run: npm run test -w project-health-dashboard-project-page-3

      - name: Build frontend
        run: npm run build:frontend -w project-health-dashboard-project-page-3
